; php.ini de PRODUCAO — espelho do ibtech/php:7.0-fpm (extraido da imagem em 08/09/2026), adaptado ao PHP 8.5.
; Diferencas intencionais vs 7.0: nenhuma de comportamento. Diretivas removidas no 8 foram tiradas (asp_tags,
; y2k_compliance, allow_call_time_pass_reference, always_populate_raw_post_data) e o que era default virou explicito.

[PHP]
engine = On
short_open_tag = On
; 423 arquivos do codebase usam <? — obrigatorio nos dois runtimes
expose_php = Off
output_buffering = 4096
implicit_flush = Off
serialize_precision = 17
; 17 como em prod: json_encode de float igual ao container 7.0-fpm atual (o default -1 do PHP 7.1+ mudaria a saida)
disable_functions =
disable_classes =
ignore_user_abort = On
zend.enable_gc = On
unserialize_callback_func =
zlib.output_compression = Off
max_execution_time = 300

display_errors = Off
display_startup_errors = Off
error_reporting = E_COMPILE_ERROR|E_ERROR|E_CORE_ERROR

log_errors = On
error_log = /dev/stderr
date.timezone = America/Sao_Paulo
upload_max_filesize = 100000M
post_max_size = 100000M
session.gc_maxlifetime = 14400


[opcache]
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=60
opcache.save_comments=1

[opcache]
; JIT desligado de proposito: paridade de comportamento primeiro; ligar e outra decisao, medida.
opcache.jit=off
opcache.jit_buffer_size=0
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
