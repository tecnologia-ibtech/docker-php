; php.ini de DESENVOLVIMENTO — ibtech/php:8.5-dev
; Mesmas diretivas de comportamento da 8.5-fpm (producao) — short_open_tag On (423 arquivos usam <?),
; serialize_precision 17 (json_encode de float igual ao 7.0-fpm), gc 14400, TZ, uploads — e o que muda
; num ambiente de dev: erros VISIVEIS e opcache revalidando a cada request.
; No b2b local o setup-b2b monta ./config_win por cima de /usr/local/etc/php, entao ali quem vale e o
; config_win/php.ini do repositorio; este arquivo cobre quem usa a imagem sem esse mount.

[PHP]
engine = On
short_open_tag = On
expose_php = Off
output_buffering = 4096
implicit_flush = Off
serialize_precision = 17
disable_functions =
disable_classes =
ignore_user_abort = On
zend.enable_gc = On
unserialize_callback_func =
zlib.output_compression = Off
max_execution_time = 300
memory_limit = 512M

; dev: tudo visivel — inclusive E_DEPRECATED, que e como se caca paridade 7.0 x 8.5
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr
html_errors = Off

date.timezone = America/Sao_Paulo
upload_max_filesize = 100000M
post_max_size = 100000M
session.gc_maxlifetime = 14400

[opcache]
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
; dev: le o arquivo mudado no request seguinte
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.save_comments=1
; JIT desligado como em producao: paridade de comportamento primeiro
opcache.jit=off
opcache.jit_buffer_size=0
