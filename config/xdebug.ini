; Xdebug 3 — desligado por padrao. Ligar por ambiente, sem mexer em arquivo:
;   XDEBUG_MODE=debug            (setup-b2b: IBTECH_XDEBUG=1)
;   XDEBUG_MODE=debug,profile    (perfil em /tmp/xdebug)
; A env XDEBUG_MODE sobrepoe xdebug.mode; XDEBUG_CONFIG="client_host=x client_port=y" sobrepoe o resto.
xdebug.mode=off
xdebug.start_with_request=yes
xdebug.client_host=host.docker.internal
xdebug.client_port=9000
xdebug.idekey=PHPSTORM
xdebug.discover_client_host=false
xdebug.output_dir=/tmp/xdebug
xdebug.max_nesting_level=99999999
